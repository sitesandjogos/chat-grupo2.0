<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat em Grupo</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(circle at top, #161b2e 0%, #0d1117 60%);
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    margin: 20px 0 4px;
    font-size: 1.9rem;
    background: linear-gradient(90deg, #58a6ff, #3fb950, #58a6ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    color: #8b949e;
    margin-bottom: 25px;
    font-size: 0.85rem;
  }

  /* ---------- LOBBY ---------- */
  #lobby {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 30px;
    max-width: 420px;
    width: 100%;
    animation: fadeIn 0.4s ease;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .lobby-section {
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid #21262d;
  }
  .lobby-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  input[type="text"] {
    width: 100%;
    background: #0d1117;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { outline: none; border-color: #58a6ff; }

  .btn {
    background: #238636;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: #2ea043; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn.secondary { background: #21262d; border: 1px solid #30363d; }
  .btn.secondary:hover { background: #30363d; }

  #myIdDisplay {
    background: #0d1117;
    border: 1px solid #238636;
    color: #3fb950;
    padding: 12px;
    border-radius: 8px;
    font-size: 1rem;
    letter-spacing: 2px;
    margin: 10px 0;
    text-align: center;
    word-break: break-all;
    cursor: pointer;
    animation: pulseBorder 2s ease-in-out infinite;
  }
  @keyframes pulseBorder {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63,185,80,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(63,185,80,0); }
  }

  .status {
    margin-top: 12px;
    font-size: 0.8rem;
    color: #d29922;
    min-height: 16px;
  }

  .avatar-picker {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .avatar-preview {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    background: #21262d;
    border: 1px solid #30363d;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: #8b949e;
    cursor: pointer;
    overflow: hidden;
  }
  .avatar-picker input[type="file"] { display: none; }
  .avatar-picker label { font-size: 0.75rem; color: #58a6ff; cursor: pointer; }

  /* ---------- CHAT ---------- */
  #chatWrap {
    display: none;
    flex-direction: column;
    width: 100%;
    max-width: 620px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    overflow: hidden;
    height: 75vh;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    animation: fadeIn 0.4s ease;
  }

  .chat-header {
    padding: 14px 18px;
    background: #21262d;
    border-bottom: 1px solid #30363d;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
  }

  .chat-header .code { color: #3fb950; font-weight: 600; }

  .members {
    color: #8b949e;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .online-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3fb950;
    box-shadow: 0 0 0 0 rgba(63,185,80,0.6);
    animation: dotPulse 1.6s infinite;
  }
  @keyframes dotPulse {
    0% { box-shadow: 0 0 0 0 rgba(63,185,80,0.6); }
    70% { box-shadow: 0 0 0 6px rgba(63,185,80,0); }
    100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); }
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: slideIn 0.25s ease;
    max-width: 80%;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg-row.mine { flex-direction: row-reverse; align-self: flex-end; }
  .msg-row.theirs { align-self: flex-start; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    background: #30363d;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: #e6edf3;
  }

  .msg {
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.4;
    word-wrap: break-word;
    transition: transform 0.1s;
  }
  .msg.mine { background: linear-gradient(135deg, #1f6feb, #2f81f7); color: #fff; border-bottom-right-radius: 3px; }
  .msg.theirs { background: #21262d; border-bottom-left-radius: 3px; }
  .msg.system {
    align-self: center;
    background: transparent;
    color: #8b949e;
    font-size: 0.75rem;
    font-style: italic;
  }

  .msg .sender { font-size: 0.7rem; color: #8b949e; margin-bottom: 3px; display: block; }
  .msg.mine .sender { display: none; }

  .msg img.chat-photo {
    max-width: 220px;
    max-height: 220px;
    border-radius: 8px;
    display: block;
    margin-top: 4px;
    cursor: pointer;
  }

  .msg audio.chat-audio {
    margin-top: 4px;
    max-width: 220px;
    height: 36px;
  }

  .chat-input {
    display: flex;
    align-items: center;
    padding: 12px;
    border-top: 1px solid #30363d;
    gap: 8px;
  }

  .chat-input input[type="text"] {
    flex: 1;
    background: #0d1117;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 10px 12px;
    border-radius: 20px;
    font-size: 0.9rem;
    margin-bottom: 0;
  }
  .chat-input input[type="text"]:focus { outline: none; border-color: #58a6ff; }

  .icon-btn {
    background: #21262d;
    border: 1px solid #30363d;
    color: #e6edf3;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  .icon-btn:hover { background: #30363d; transform: scale(1.05); }
  .icon-btn.recording {
    background: #f85149;
    border-color: #f85149;
    animation: recPulse 1s infinite;
  }
  @keyframes recPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,81,73,0.5); }
    50% { box-shadow: 0 0 0 8px rgba(248,81,73,0); }
  }

  .send-btn {
    background: #238636;
    color: #fff;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: background 0.15s, transform 0.1s;
  }
  .send-btn:hover { background: #2ea043; transform: scale(1.05); }

  #hiddenPhotoInput { display: none; }

  .typing-indicator {
    font-size: 0.75rem;
    color: #8b949e;
    font-style: italic;
    padding: 0 16px 6px;
    min-height: 16px;
  }

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    z-index: 999;
    cursor: zoom-out;
  }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
</style>
</head>
<body>

<h1>💬 Chat em Grupo</h1>
<div class="subtitle">Crie uma sala ou entre com um código</div>

<!-- LOBBY -->
<div id="lobby">
  <div class="lobby-section">
    <div class="avatar-picker">
      <div class="avatar-preview" id="avatarPreviewCreate">📷</div>
      <label for="avatarInputCreate">Escolher foto (opcional)</label>
      <input type="file" id="avatarInputCreate" accept="image/*">
    </div>
    <input type="text" id="myNameCreate" placeholder="Seu nome">
    <button class="btn" id="createBtn">CRIAR GRUPO</button>
    <div id="myIdDisplay" style="display:none;"></div>
    <div style="font-size:0.75rem;color:#8b949e;margin-top:6px;" id="createHint"></div>
  </div>

  <div class="lobby-section">
    <div class="avatar-picker">
      <div class="avatar-preview" id="avatarPreviewJoin">📷</div>
      <label for="avatarInputJoin">Escolher foto (opcional)</label>
      <input type="file" id="avatarInputJoin" accept="image/*">
    </div>
    <input type="text" id="myNameJoin" placeholder="Seu nome">
    <input type="text" id="joinInput" placeholder="Código do grupo">
    <button class="btn secondary" id="joinBtn">ENTRAR NO GRUPO</button>
  </div>

  <div class="status" id="statusMsg"></div>
</div>

<!-- CHAT -->
<div id="chatWrap">
  <div class="chat-header">
    <div>Código: <span class="code" id="roomCodeDisplay"></span></div>
    <div class="members"><span class="online-dot"></span><span id="membersCount">1 online</span></div>
  </div>
  <div id="messages"></div>
  <div class="typing-indicator" id="typingIndicator"></div>
  <div class="chat-input">
    <input type="file" id="hiddenPhotoInput" accept="image/*">
    <button class="icon-btn" id="photoBtn" title="Enviar foto">📷</button>
    <button class="icon-btn" id="audioBtn" title="Gravar áudio">🎤</button>
    <input type="text" id="msgInput" placeholder="Digite uma mensagem...">
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>

<script>
let peer = null;
let isHost = false;
let myName = '';
let myAvatar = null;
let connections = [];
let peerInfo = {};
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

const lobby = document.getElementById('lobby');
const chatWrap = document.getElementById('chatWrap');
const statusMsg = document.getElementById('statusMsg');
const myIdDisplay = document.getElementById('myIdDisplay');
const createHint = document.getElementById('createHint');
const roomCodeDisplay = document.getElementById('roomCodeDisplay');
const membersCount = document.getElementById('membersCount');
const messagesEl = document.getElementById('messages');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

document.getElementById('createBtn').addEventListener('click', createGroup);
document.getElementById('joinBtn').addEventListener('click', joinGroup);
document.getElementById('sendBtn').addEventListener('click', sendTextMessage);
document.getElementById('msgInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendTextMessage();
});
document.getElementById('photoBtn').addEventListener('click', () => {
  document.getElementById('hiddenPhotoInput').click();
});
document.getElementById('hiddenPhotoInput').addEventListener('change', handlePhotoSelected);
document.getElementById('audioBtn').addEventListener('click', toggleRecording);
lightbox.addEventListener('click', () => { lightbox.style.display = 'none'; });

function setStatus(text, color) {
  statusMsg.textContent = text;
  statusMsg.style.color = color || '#d29922';
}

/* ============== AVATAR (FOTO DE PERFIL) ============== */
function resizeImageToDataURL(file, maxSize, quality, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
      else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function setupAvatarPicker(inputId, previewId) {
  const input = document.getElementById(inputId);
  const preview = document.getElementById(previewId);
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;
    resizeImageToDataURL(file, 128, 0.7, (dataUrl) => {
      myAvatar = dataUrl;
      preview.innerHTML = '';
      const img = document.createElement('img');
      img.src = dataUrl;
      img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'cover';
      preview.appendChild(img);
    });
  });
}
setupAvatarPicker('avatarInputCreate', 'avatarPreviewCreate');
setupAvatarPicker('avatarInputJoin', 'avatarPreviewJoin');

function initials(name) {
  return (name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function makeAvatarEl(name, avatarUrl) {
  const el = document.createElement('div');
  el.className = 'avatar';
  if (avatarUrl) {
    const img = document.createElement('img');
    img.src = avatarUrl;
    img.style.width = '100%'; img.style.height = '100%'; img.style.borderRadius = '50%'; img.style.objectFit = 'cover';
    el.appendChild(img);
  } else {
    el.textContent = initials(name);
  }
  return el;
}

/* ============== CRIAR GRUPO (HOST) ============== */
function createGroup() {
  myName = document.getElementById('myNameCreate').value.trim() || 'Anônimo';
  document.getElementById('createBtn').disabled = true;
  setStatus('Gerando grupo...', '#d29922');

  peer = new Peer();

  peer.on('open', (id) => {
    isHost = true;
    myIdDisplay.style.display = 'block';
    myIdDisplay.textContent = id;
    createHint.textContent = 'Envie este código pra quem quiser entrar (clique para copiar)';
    myIdDisplay.addEventListener('click', () => {
      navigator.clipboard.writeText(id).then(() => { createHint.textContent = 'Código copiado!'; });
    });
    setStatus('Grupo criado! Aguardando pessoas entrarem...', '#3fb950');
    enterChat(id);
  });

  peer.on('connection', (conn) => setupHostConnection(conn));
  peer.on('error', (err) => {
    setStatus('Erro: ' + err.type, '#f85149');
    document.getElementById('createBtn').disabled = false;
  });
}

function setupHostConnection(conn) {
  conn.on('open', () => { connections.push(conn); updateMembersCount(); });

  conn.on('data', (data) => {
    if (data.type === 'chat') {
      const info = peerInfo[conn.peer] || { name: data.name, avatar: null };
      addMessage(info.name, false, data.kind, data.content, info.avatar);
      broadcastToOthers(conn, { type: 'chat', name: info.name, avatar: info.avatar, kind: data.kind, content: data.content });
    } else if (data.type === 'join') {
      peerInfo[conn.peer] = { name: data.name, avatar: data.avatar || null };
      addMessage(null, null, null, `${data.name} entrou no grupo`, null, true);
      broadcastToOthers(conn, { type: 'system', text: `${data.name} entrou no grupo` });
    }
  });

  conn.on('close', () => {
    const info = peerInfo[conn.peer];
    connections = connections.filter(c => c !== conn);
    delete peerInfo[conn.peer];
    updateMembersCount();
    if (info) {
      addMessage(null, null, null, `${info.name} saiu do grupo`, null, true);
      broadcastToAll({ type: 'system', text: `${info.name} saiu do grupo` });
    }
  });
}

function broadcastToOthers(exceptConn, data) {
  connections.forEach(c => { if (c !== exceptConn && c.open) c.send(data); });
}
function broadcastToAll(data) {
  connections.forEach(c => { if (c.open) c.send(data); });
}
function updateMembersCount() {
  membersCount.textContent = `${connections.length + 1} online`;
}

/* ============== ENTRAR NO GRUPO (CLIENTE) ============== */
function joinGroup() {
  myName = document.getElementById('myNameJoin').value.trim() || 'Anônimo';
  const targetId = document.getElementById('joinInput').value.trim();
  if (!targetId) { setStatus('Digite um código válido', '#f85149'); return; }

  document.getElementById('joinBtn').disabled = true;
  setStatus('Conectando...', '#d29922');

  peer = new Peer();
  peer.on('open', () => {
    isHost = false;
    const conn = peer.connect(targetId, { reliable: true });
    connections = [conn];

    conn.on('open', () => {
      setStatus('Conectado!', '#3fb950');
      conn.send({ type: 'join', name: myName, avatar: myAvatar });
      enterChat(targetId);
    });

    conn.on('data', (data) => {
      if (data.type === 'chat') {
        addMessage(data.name, false, data.kind, data.content, data.avatar);
      } else if (data.type === 'system') {
        addMessage(null, null, null, data.text, null, true);
      }
    });

    conn.on('close', () => addMessage(null, null, null, 'Conexão encerrada pelo grupo', null, true));
    conn.on('error', () => setStatus('Erro na conexão', '#f85149'));
  });

  peer.on('error', (err) => {
    setStatus('Erro: ' + err.type, '#f85149');
    document.getElementById('joinBtn').disabled = false;
  });
}

/* ============== CHAT UI ============== */
function enterChat(code) {
  lobby.style.display = 'none';
  chatWrap.style.display = 'flex';
  roomCodeDisplay.textContent = code;
  updateMembersCount();
  addMessage(null, null, null, isHost ? 'Você criou o grupo' : 'Você entrou no grupo', null, true);
}

// kind: 'text' | 'image' | 'audio' | null (para system)
function addMessage(name, mine, kind, content, avatarUrl, isSystem) {
  if (isSystem) {
    const div = document.createElement('div');
    div.className = 'msg system';
    div.textContent = content;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return;
  }

  const row = document.createElement('div');
  row.className = 'msg-row ' + (mine ? 'mine' : 'theirs');
  row.appendChild(makeAvatarEl(mine ? myName : name, avatarUrl));

  const div = document.createElement('div');
  div.className = 'msg ' + (mine ? 'mine' : 'theirs');

  if (!mine && name) {
    const senderSpan = document.createElement('span');
    senderSpan.className = 'sender';
    senderSpan.textContent = name;
    div.appendChild(senderSpan);
  }

  if (kind === 'text') {
    div.appendChild(document.createTextNode(content));
  } else if (kind === 'image') {
    const img = document.createElement('img');
    img.className = 'chat-photo';
    img.src = content;
    img.addEventListener('click', () => {
      lightboxImg.src = content;
      lightbox.style.display = 'flex';
    });
    div.appendChild(img);
  } else if (kind === 'audio') {
    const audio = document.createElement('audio');
    audio.className = 'chat-audio';
    audio.controls = true;
    audio.src = content;
    div.appendChild(audio);
  }

  row.appendChild(div);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function sendChatPayload(kind, content) {
  addMessage(myName, true, kind, content, myAvatar);
  if (isHost) {
    broadcastToAll({ type: 'chat', name: myName, avatar: myAvatar, kind, content });
  } else if (connections[0]) {
    connections[0].send({ type: 'chat', name: myName, kind, content });
  }
}

function sendTextMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  sendChatPayload('text', text);
  input.value = '';
}

/* ============== ENVIAR FOTO ============== */
function handlePhotoSelected() {
  const input = document.getElementById('hiddenPhotoInput');
  const file = input.files[0];
  if (!file) return;
  resizeImageToDataURL(file, 800, 0.75, (dataUrl) => {
    sendChatPayload('image', dataUrl);
  });
  input.value = '';
}

/* ============== GRAVAR E ENVIAR ÁUDIO ============== */
function toggleRecording() {
  if (isRecording) {
    mediaRecorder.stop();
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = () => sendChatPayload('audio', reader.result);
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t => t.stop());
      isRecording = false;
      document.getElementById('audioBtn').classList.remove('recording');
    };
    mediaRecorder.start();
    isRecording = true;
    document.getElementById('audioBtn').classList.add('recording');
  }).catch(() => {
    setStatus('Não foi possível acessar o microfone', '#f85149');
  });
}
</script>

</body>
</html>
